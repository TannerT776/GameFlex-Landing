<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameFlex | Capture. Create. Connect.</title>

    <meta
        name="description"
        content="GameFlex helps gamers capture, create, and connect through the moments they want to share."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">

            <a href="#home" class="brand" aria-label="GameFlex Home">
                <img
                    src="images/branding/gf-logo_stacked-hor.png"
                    alt="GameFlex"
                    class="brand-logo"
                >
            </a>

            <button
                class="menu-toggle"
                type="button"
                aria-label="Open navigation"
                aria-expanded="false"
                aria-controls="site-navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav
                class="site-nav"
                id="site-navigation"
                aria-label="Main navigation"
            >
                <a href="#how-it-works">How It Works</a>
                <a href="#features">Features</a>
                <a href="#download">Download</a>
            </nav>

            <a
                href="#download"
                class="button button-primary nav-download"
            >
                Download App
            </a>

        </div>
    </header>

    <main>

        <section class="hero" id="home">
            <div class="container hero-content">

                <p class="hero-label">
                    GameFlex
                </p>

                <h1>
                    Capture. Create. Connect.
                </h1>

                <p class="hero-description">
                    Turn your best gaming moments into FLEXes and share them
                    with the players and communities that matter to you.
                </p>

                <div class="hero-actions">

                    <a
                        href="#download"
                        class="button button-primary"
                    >
                        Download App
                    </a>

                    <a
                        href="#how-it-works"
                        class="button button-secondary"
                    >
                        See How It Works
                    </a>

                </div>

            </div>
        </section>

        <section
            class="how-it-works"
            id="how-it-works"
        >
        </section>

        <section
            class="features"
            id="features"
        >
        </section>

        <section
            class="download"
            id="download"
        >
        </section>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
